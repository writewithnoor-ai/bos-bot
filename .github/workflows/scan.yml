name: scan
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: scan
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check secrets format
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          python -c "import os,re;t=os.environ['TELEGRAM_BOT_TOKEN'];c=os.environ['TELEGRAM_CHAT_ID'];k=os.environ['TWELVEDATA_API_KEY'];print('token ok:',bool(re.fullmatch(r'\d{6,}:[A-Za-z0-9_-]{30,}',t)),'length',len(t));print('chat id ok:',bool(re.fullmatch(r'-?\d+',c)));print('twelve key length:',len(k),'hex32:',bool(re.fullmatch(r'[0-9a-f]{32}',k)))"
      - run: python scanner.py --test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
